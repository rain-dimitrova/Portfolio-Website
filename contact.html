<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contact</title>
</head>

<body>
    <div class="navbar-container">
        <div class="logo">RAIN</div>
        <div class="nav-items">
            <ul class="nav-links">
                <li><a href="index.html" class="active">HOME</a></li>
                <li><a href="portfolio.html">PORTFOLIO</a></li>
                <li><a href="about.html">ABOUT ME</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </div>
    </div>

    <section class="commission-form">
        <h2>Project Request</h2>
        <form action="https://formspree.io/f/your-form-id" method="POST" enctype="multipart/form-data">

            <!-- basic info -->
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Full Name*</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email*</label>
                    <input type="email" id="email" name="email" required>
                </div>
            </div>

            <!-- details of project -->
            <div class="form-group">
                <label for="project-type">Project Type*</label>
                <select id="project-type" name="project-type" required>
                    <option value="" disabled selected>Select one...</option>
                    <option value="portrait">Portrait Illustration</option>
                    <option value="illustration">Full Body Illustration</option>
                    <option value="logo">Graphic Design</option>
                    <option value="logo">Animation</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Description*</label>
                <textarea id="description" name="description" rows="5" required
                    placeholder="Describe what you would like (subject, style, size, deadline...)"></textarea>
            </div>

            <!-- Budget & Files -->
            <div class="form-row">
                <div class="form-group">
                    <label for="budget">Budget Range</label>
                    <select id="budget" name="budget">
                        <option value="" selected>Not specified</option>
                        <option value="50-100">$50-$100</option>
                        <option value="100-200">$100-$200</option>
                        <option value="200+">$200+</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="reference">Reference Images (optional)</label>
                    <input type="file" id="reference" name="reference" accept="image/*">
                </div>
            </div>

            <!-- T&Cs -->
            <div class="form-group terms">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the <a href="/terms">commission terms</a>*</label>
            </div>

            <!-- submit form -->
            <button type="submit" class="submit-btn">Send Request</button>

            <!-- Fallback for non-formspree users -->
            <input type="hidden" name="_next" value="/thank-you">
            <input type="text" name="_gotcha" style="display:none">
        </form>
    </section>
    </div>
</body>

</html>
