        <section class="commission-section">
            <div class="commission-container">
                <h1>Request a Commission</h1>

                <form class="commission-form" action="mailto:your-email@example.com" method="post" enctype="text/plain">
                    <div class="form-group">
                        <label for="name">Full Name*</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email*</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="type">Art Type*</label>
                        <select id="type" name="type" required>
                            <option value="" disabled selected>Select commission type...</option>
                            <option value="portrait">Portrait Illustration</option>
                            <option value="illustration">Full Body Illustration</option>
                            <option value="character-design">Character Design</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="description">Project Description*</label>
                        <textarea id="description" name="description" rows="5" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="deadline">Desired Deadline (optional)</label>
                        <input type="date" id="deadline" name="deadline">
                    </div>

                    <div class="form-group">
                        <label for="reference">Reference Images*</label>
                        <input type="file" id="reference" name="reference" accept="image/*" multiple required>
                        <p class="file-hint">Upload JPG, PNG, or GIF files (max 5MB each)</p>
                    </div>

                    <div class="form-group terms">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">I agree to the <a href="/terms">commission terms</a>*</label>
                    </div>

                    <button type="submit" class="submit-btn">Send Request</button>
                </form>
            </div>
